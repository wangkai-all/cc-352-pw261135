<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 虚构填报门户</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">虚构填报门户</span>
    <span class="fictional">演示系统 · 全部数据均为虚构</span>
  </header>
  <main class="narrow">
    <h1>登录</h1>
    <p class="muted">演示账号：<code>alpha</code> / <code>alpha2</code>（阿尔法）或 <code>beta</code>（贝塔），密码均为 <code>demo1234</code></p>
    <form id="login-form">
      <label>账号
        <input data-field="username" autocomplete="username" required />
      </label>
      <label>密码
        <input data-field="password" type="password" autocomplete="current-password" required />
      </label>
      <button id="login-btn" type="submit">登录</button>
      <p id="login-error" class="error" hidden>账号或密码不正确</p>
    </form>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.querySelector('[data-field="username"]').value.trim();
      const password = document.querySelector('[data-field="password"]').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        location.href = next;
      } else {
        document.getElementById('login-error').hidden = false;
      }
    });
  </script>
</body>
</html>
